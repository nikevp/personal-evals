schema_version = "1.3"

[task]
name = "logistics/painting-shipping-companies"
description = "Research and prioritize companies that could ship a painting from Hong Kong to Palm Beach without contacting them."
authors = [{ name = "SFT.ai" }]
keywords = ["logistics", "research", "shipping", "companies", "contacts", "fine-art", "rewardkit", "judge-grading"]

[metadata]
checkpoint = "shipping-company-research"
category = "real-world-logistics"
difficulty = "hard"
verifier_stage = 2
verifier_purpose = "qualified-shipping-company-and-contact-discovery"
tracking_artifact = "prioritized-shipping-company-list"

[verifier]
timeout_sec = 600.0

[verifier.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}"

[agent]
timeout_sec = 1200.0
network_mode = "public"

[[environment.mcp_servers]]
name = "email"
transport = "streamable-http"
url = "http://email:8000/mcp"

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096
storage_mb = 10240
allow_internet = true
network_mode = "public"
