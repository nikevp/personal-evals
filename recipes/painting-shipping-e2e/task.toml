schema_version = "1.4"

artifacts = [
  { source = "/logs/artifacts", destination = "agent-artifacts" },
  { source = "/logs/agent/trajectory.json", destination = "trajectory.json" },
  { source = "/state/world.json", destination = "world-state.json", service = "communications" },
]

[task]
name = "logistics/painting-shipping-e2e"
description = "Autonomously manage an international painting shipment from the initial request through simulated delivery in one uninterrupted run."
authors = [{ name = "SFT.ai" }]
keywords = ["logistics", "shipping", "end-to-end", "long-running", "communications", "rewardkit"]

[metadata]
category = "real-world-logistics"
difficulty = "hard"
checkpoint = "end-to-end-shipping"

[agent]
timeout_sec = 3600.0
network_mode = "public"

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"

[verifier.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}"

[verifier.environment]
build_timeout_sec = 300.0
cpus = 1
memory_mb = 3072
storage_mb = 6144
allow_internet = true
network_mode = "public"

[environment]
build_timeout_sec = 600.0
cpus = 4
memory_mb = 8192
storage_mb = 10240
allow_internet = true
network_mode = "public"
workdir = "/workspace"

[[environment.mcp_servers]]
name = "communications"
transport = "streamable-http"
url = "http://communications:8000/mcp"
